<body data-pagina="registro">
  <nav class="barra">
    <div class="contenedor">
      <a class="marca" href="./"><img src="img/icono.png" alt="MU GKZ"></a>
      <div class="menu">
        <a href="./" data-pagina="inicio">Inicio</a>
        <a href="registro.html" data-pagina="registro">Registro</a>
        <a href="rankings.html" data-pagina="rankings">Rankings</a>
        <a href="info.html" data-pagina="info">Información</a>
      </div>
      <div class="jugador" title="Muy pronto">
        <span class="avatar"></span>
        <span>Área del jugador<b>Próximamente</b></span>
      </div>
    </div>
  </nav>

  <main class="contenedor">
    <div class="titulo-pagina"><h1>Registro</h1><p>Creá tu cuenta gratis y empezá a jugar.</p></div>
    <section class="panel">
      <div class="cuerpo">
        <form class="formulario" id="registro" autocomplete="off" novalidate>
          <label>Usuario
            <input name="usuario" maxlength="10" required autocomplete="username" spellcheck="false">
            <span class="ayuda">De 4 a 10 letras o números. Es el que vas a usar para entrar al juego.</span>
          </label>
          <label>Contraseña
            <input name="clave" type="password" maxlength="20" required autocomplete="new-password">
            <span class="ayuda">De 6 a 20 caracteres. No uses la misma que en otros sitios.</span>
          </label>
          <label>Repetí la contraseña
            <input name="clave2" type="password" maxlength="20" required autocomplete="new-password">
          </label>
          <label>E-mail (opcional)
            <input name="email" type="email" maxlength="254" autocomplete="email" spellcheck="false">
            <span class="ayuda">Sirve para recuperar la cuenta más adelante.</span>
          </label>
          <div class="mensaje" id="registro-mensaje" role="status"></div>
          <button class="boton" type="submit">Crear cuenta</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="pie-pagina">

    </div>
  </footer>
