# MU GKZ: los servidores de jugar.mugkz.com. Se activa copiando este archivo sobre el vacío
# gkz-jugar-servers.conf del VPS, recién cuando existe el certificado de jugar.mugkz.com.
server {
    listen 80;
    server_name jugar.mugkz.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://jugar.mugkz.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name jugar.mugkz.com;

    ssl_certificate /etc/letsencrypt/live/jugar.mugkz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jugar.mugkz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;

    include /etc/nginx/gkz-jugar.conf;
}
