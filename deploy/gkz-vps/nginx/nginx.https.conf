# MU GKZ: HTTPS with the certificate of Let's Encrypt (certbot renews it); HTTP redirects to it.
events {
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    # At most 3 account registrations per minute and IP (with a small burst).
    limit_req_zone $binary_remote_addr zone=gkz_register:1m rate=3r/m;

    # La web y sus datos: 10 pedidos por segundo e IP (con ráfagas).
    limit_req_zone $binary_remote_addr zone=gkz_web:5m rate=10r/s;
    limit_req_status 429;

    # El juego en el navegador: conexiones WebSocket simultáneas por IP (cada jugador usa 1 o 2).
    limit_conn_zone $binary_remote_addr zone=gkz_puente:5m;
    limit_conn_status 429;

    server {
        listen 80;
        server_name mugkz.com www.mugkz.com _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://mugkz.com$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name mugkz.com www.mugkz.com;

        ssl_certificate /etc/letsencrypt/live/mugkz.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mugkz.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:5m;

        include /etc/nginx/gkz-public.conf;
    }

    # El juego en el navegador (prueba privada): sus servidores, solo si ya hay certificado.
    include /etc/nginx/gkz-jugar-servers.conf;
}
