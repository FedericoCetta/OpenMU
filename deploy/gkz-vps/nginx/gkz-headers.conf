# MU GKZ: cabeceras de seguridad de la web. nginx no hereda add_header en una location que tenga
# las suyas, por eso este archivo se incluye en cada una.
#
# CSP: el navegador solo ejecuta scripts, estilos, imágenes y fuentes de este mismo sitio. No hay
# scripts ni estilos dentro del HTML, así que aunque se colara un nombre con código, no se ejecuta.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
