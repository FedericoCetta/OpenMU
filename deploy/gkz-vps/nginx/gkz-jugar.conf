# MU GKZ: el juego en el navegador (jugar.mugkz.com). Prueba privada: todo pide usuario y contraseña
# (jugar.htpasswd, solo en el VPS, no en git).
auth_basic "MU GKZ - prueba privada";
auth_basic_user_file /etc/nginx/jugar.htpasswd;

root /usr/share/nginx/gkz-jugar;
client_max_body_size 1k;
limit_req zone=gkz_web burst=60 nodelay;

# Los archivos del juego van comprimidos de antemano (.gz al lado de cada uno).
gzip_static on;

location = / {
    limit_except GET { deny all; }
    try_files /Main.html =404;
    include /etc/nginx/gkz-headers-jugar.conf;
    add_header Cache-Control "no-cache" always;
}

location / {
    limit_except GET { deny all; }
    try_files $uri =404;
    include /etc/nginx/gkz-headers-jugar.conf;
    add_header Cache-Control "no-cache" always;
}

# La conexión del juego: WebSocket al puente, que solo llega a los puertos de nuestro servidor.
location = /puente {
    limit_conn gkz_puente 6;
    proxy_pass http://puente:8768;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_read_timeout 310s;
    proxy_send_timeout 310s;
}
