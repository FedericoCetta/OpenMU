# MU GKZ: the public routes, shared by the HTTP and the HTTPS server.
# The admin panel isn't proxied here: it's only reachable through an SSH tunnel (127.0.0.1:8081).

# The API keys are set in gkz-secrets.conf (not in git, see gkz-secrets.conf.example).
include /etc/nginx/gkz-secrets.conf;

# Solo se aceptan GET/HEAD en todo el sitio, salvo el registro (POST).
client_max_body_size 1k;

# Update files and news. They are static and signed; see the MuGkz.Publisher.
location /launcher/ {
    alias /usr/share/nginx/gkz-launcher/;
    autoindex off;
    limit_except GET { deny all; }
    include /etc/nginx/gkz-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# Noticias de la web y del launcher: se editan en el admin (página Noticias) y salen de la base.
# Es la misma dirección que el launcher ya usaba para el news.json estático.
location = /launcher/news.json {
    limit_except GET { deny all; }
    limit_req zone=gkz_web burst=20 nodelay;
    proxy_pass http://openmu-startup:8080/api/public-web/news;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    include /etc/nginx/gkz-headers.conf;
}

# Server status for the launcher: only the state and the number of players (no names).
location = /public/status {
    limit_except GET { deny all; }
    limit_req zone=gkz_web burst=20 nodelay;
    proxy_pass http://openmu-startup:8080/api/public-web/launcher-status;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
}

# Account registration for the launcher and the website, rate limited per IP.
location = /public/register {
    limit_except POST { deny all; }
    limit_req zone=gkz_register burst=3 nodelay;
    # Solo al registro con captcha: el de /api/accounts sin captcha queda para uso interno.
    proxy_pass http://openmu-startup:8080/api/accounts/public;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Api-Key $gkz_register_key;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    include /etc/nginx/gkz-headers.conf;
}

# Datos de la web (rankings, Castle Siege, eventos, estado). Solo estas rutas exactas, solo GET,
# con límite por IP. OpenMU además guarda las respuestas en caché 60 segundos.
location ~ ^/public/web/(status|events|castle|info|rankings/(?:resets|level|killers|guilds))$ {
    limit_except GET { deny all; }
    limit_req zone=gkz_web burst=20 nodelay;
    rewrite ^/public/web/(.*)$ /api/public-web/$1 break;
    proxy_pass http://openmu-startup:8080;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    include /etc/nginx/gkz-headers.conf;
}

location /public/ {
    return 404;
}

# La página de registro: igual que el resto de la web, pero con la CSP que permite el captcha.
location = /registro.html {
    root /usr/share/nginx/gkz-web;
    limit_except GET { deny all; }
    limit_req zone=gkz_web burst=40 nodelay;
    include /etc/nginx/gkz-headers-registro.conf;
    add_header Cache-Control "no-cache" always;
}

# La web: archivos estáticos, sin nada que se ejecute en el servidor.
location / {
    root /usr/share/nginx/gkz-web;
    index index.html;
    try_files $uri $uri/ =404;
    limit_except GET { deny all; }
    limit_req zone=gkz_web burst=40 nodelay;
    include /etc/nginx/gkz-headers.conf;
    add_header Cache-Control "public, max-age=300" always;
}

# Archivos ocultos (.git, .env, etc.): nunca. La carpeta de certbot queda afuera.
location ~ /\.(?!well-known/) {
    return 404;
}
