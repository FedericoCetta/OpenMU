# MU GKZ production stack (VPS). Lives in /opt/mugkz on the server; secrets are in .env there (not in git).
# Public: the connect server, the game servers, the chat server and nginx (launcher files, status, register).
# Not public: the admin panel (127.0.0.1:8081, reach it with an SSH tunnel) and the database.
services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # nginx.conf is a copy of nginx.http.conf (before the certificate exists) or nginx.https.conf.
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/gkz-public.conf:/etc/nginx/gkz-public.conf:ro
      - ./nginx/gkz-secrets.conf:/etc/nginx/gkz-secrets.conf:ro
      - ./nginx/gkz-headers.conf:/etc/nginx/gkz-headers.conf:ro
      - ./nginx/gkz-headers-registro.conf:/etc/nginx/gkz-headers-registro.conf:ro
      # El juego en el navegador (jugar.mugkz.com): sus servidores, rutas, cabeceras, usuarios y archivos.
      - ./nginx/gkz-jugar-servers.conf:/etc/nginx/gkz-jugar-servers.conf:ro
      - ./nginx/gkz-jugar.conf:/etc/nginx/gkz-jugar.conf:ro
      - ./nginx/gkz-headers-jugar.conf:/etc/nginx/gkz-headers-jugar.conf:ro
      - ./nginx/jugar.htpasswd:/etc/nginx/jugar.htpasswd:ro
      - ./jugar:/usr/share/nginx/gkz-jugar:ro
      # La web pública: archivos estáticos.
      - ./web:/usr/share/nginx/gkz-web:ro
      - ./launcher:/usr/share/nginx/gkz-launcher:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - openmu-startup
      - puente

  # El puente WebSocket a TCP del juego en el navegador. Sin puertos publicados: solo nginx le habla,
  # y él solo se conecta a los puertos del juego en openmu-startup. Sin privilegios y de solo lectura.
  puente:
    build: ./puente
    image: mu-server/puente:local
    container_name: puente
    restart: unless-stopped
    command:
      - --escuchar=0.0.0.0:8768
      - --servidor=openmu-startup
      - --puertos=44405,45901-45906,45980
      - --origenes=https://jugar.mugkz.com
      - --maximo=500
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    depends_on:
      - openmu-startup

  openmu-startup:
    image: mu-server/openmu:local
    container_name: openmu-startup
    restart: unless-stopped
    # Only used when the database doesn't exist yet: initialize it with the MU GKZ Season 3 data.
    command: ["-version:season3-gkz", "-resolveIP:${PUBLIC_IP}"]
    ports:
      - "127.0.0.1:8081:8080"
      - "44405:44405"
      - "44406:44406"
      - "45901:45901"
      - "45902:45902"
      - "45903:45903"
      - "45904:45904"
      - "45905:45905"
      - "45906:45906"
      - "45980:45980"
    environment:
      DB_HOST: database
      DB_ADMIN_USER: postgres
      DB_ADMIN_PW: ${DB_ADMIN_PW}
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      OPENMU_ADMIN_USER: ${OPENMU_ADMIN_USER}
      OPENMU_ADMIN_PASSWORD: ${OPENMU_ADMIN_PASSWORD}
      # The own network keys, client serial and anti-cheat secret (secrets/ and .env, not in git).
      GKZ_NETWORK_KEYS_FILE: /app/secrets/gkz-network-keys.json
      GKZ_CLIENT_SERIAL: ${GKZ_CLIENT_SERIAL}
      GKZ_GUARD_SECRET: ${GKZ_GUARD_SECRET}
      # Clave secreta de Cloudflare Turnstile (captcha del registro). Sin ella, el registro público rechaza todo.
      GKZ_TURNSTILE_SECRET: ${GKZ_TURNSTILE_SECRET:-}
      # Correo del panel del jugador (recuperar contraseña) por el SMTP de Brevo, como soporte@mugkz.com.
      # Sin usuario y clave, el panel funciona igual pero no puede mandar correos.
      GKZ_SMTP_USER: ${GKZ_SMTP_USER:-}
      GKZ_SMTP_PASSWORD: ${GKZ_SMTP_PASSWORD:-}
      # Cobro de los packs de GKZ Coins con Mercado Pago (cuenta de Uruguay, en dólares): el Access Token
      # y la clave secreta de los avisos (webhooks). Sin el token, el panel no vende coins.
      GKZ_MP_ACCESS_TOKEN: ${GKZ_MP_ACCESS_TOKEN:-}
      GKZ_MP_WEBHOOK_SECRET: ${GKZ_MP_WEBHOOK_SECRET:-}
    volumes:
      - adminpanel-keys:/app/data-protection-keys
      - ./logs:/app/logs
      - ./secrets/gkz-network-keys.json:/app/secrets/gkz-network-keys.json:ro
    depends_on:
      - database

  database:
    image: postgres:17
    container_name: database
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_ADMIN_PW}
      POSTGRES_DB: openmu
      POSTGRES_USER: postgres
    volumes:
      - dbdata:/var/lib/postgresql/data

volumes:
  adminpanel-keys:
  dbdata:
