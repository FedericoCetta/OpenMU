events {
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # MU GKZ: at most 3 account registrations per minute and IP (with a small burst).
    limit_req_zone $binary_remote_addr zone=gkz_register:1m rate=3r/m;
    limit_req_status 429;

    # this is required to proxy Grafana Live WebSocket connections.
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

    # Grafana relies on the admin panel login, see location /_openmu_auth.
    map $openmu_role $grafana_role {
      Administrator Admin;
      Operator Editor;
      default Viewer;
    }

    # The path of the request without the leading slash and the query, to return to it after the login.
    map $request_uri $request_path {
      ~^/(?<path>[^?]*) $path;
    }

  server {
    listen 80;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    resolver 127.0.0.11 ipv6=off;

    # Grafana of the optional monitoring stack, see docker-compose.monitoring.yml.
    # The upstream is a variable, so that nginx starts without it, too.
    location /grafana/ {
        auth_request /_openmu_auth;
        auth_request_set $openmu_user $upstream_http_x_openmu_user;
        auth_request_set $openmu_role $upstream_http_x_openmu_role;
        error_page 401 = @admin_panel_login;

        set $grafana otel-lgtm:3000;
        proxy_set_header Host $http_host;
        proxy_pass http://$grafana;

        # Grafana trusts these headers. They are always overwritten, so they can't come from the client.
        proxy_set_header X-WEBAUTH-USER $openmu_user;
        proxy_set_header X-WEBAUTH-ROLE $grafana_role;
        proxy_set_header Authorization "";
    }

    # Proxy Grafana Live WebSocket connections.
    location /grafana/api/live {
        auth_request /_openmu_auth;
        auth_request_set $openmu_user $upstream_http_x_openmu_user;
        auth_request_set $openmu_role $upstream_http_x_openmu_role;
        error_page 401 = @admin_panel_login;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;

        set $grafana otel-lgtm:3000;
        proxy_pass http://$grafana;

        # Grafana trusts these headers. They are always overwritten, so they can't come from the client.
        proxy_set_header X-WEBAUTH-USER $openmu_user;
        proxy_set_header X-WEBAUTH-ROLE $grafana_role;
        proxy_set_header Authorization "";
    }

    # Asks the admin panel whether the cookie of the original request belongs to a logged in user.
    # If so, it answers with the name and role of the user in the X-OpenMU-User and X-OpenMU-Role headers.
    location = /_openmu_auth {
        internal;
        set $admin_panel openmu-startup:8080;
        proxy_pass http://$admin_panel/auth/proxy;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location @admin_panel_login {
        # The return url has to be relative to the admin panel.
        return 302 /login?returnUrl=$request_path;
    }

    # --- MU GKZ launcher ---------------------------------------------------------------
    # The API keys are set in gkz-secrets.conf (not in git, see gkz-secrets.conf.example).
    include /etc/nginx/gkz-secrets.conf;

    # Update files and news. They are static and signed; see the MuGkz.Publisher.
    location /launcher/ {
        alias /usr/share/nginx/gkz-launcher/;
        autoindex off;
        add_header Cache-Control "no-cache" always;
    }

    # Server status for the launcher. The API key is added here, so the launcher needs none.
    location = /public/status {
        limit_except GET { deny all; }
        proxy_pass http://openmu-startup:8080/api/status;
        proxy_set_header X-Api-Key $gkz_status_key;
        proxy_set_header Cookie "";
    }

    # Account registration for the launcher, rate limited per IP.
    location = /public/register {
        limit_except POST { deny all; }
        limit_req zone=gkz_register burst=3 nodelay;
        client_max_body_size 1k;
        proxy_pass http://openmu-startup:8080/api/accounts;
        proxy_set_header X-Api-Key $gkz_register_key;
        proxy_set_header Cookie "";
    }
    # ------------------------------------------------------------------------------------

    location / {
       # Keep the port of the original request, so redirects work when port 80 is mapped elsewhere.
       proxy_set_header Host $http_host;
       proxy_pass http://openmu-startup:8080;
    }
  }
}