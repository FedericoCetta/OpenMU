# Local overrides for this machine.
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --no-build
# Rebuild the image after code changes:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.local.yml build openmu-startup
services:
  nginx-80:
    # Port 80 is taken by IIS, so the admin panel is published on 8090 instead.
    ports: !override
      - "8090:80"
    restart: unless-stopped
    # MU GKZ: own nginx configuration with the public launcher routes, and the published launcher files.
    volumes: !override
      - ./nginx/nginx.gkz.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/gkz-secrets.conf:/etc/nginx/gkz-secrets.conf:ro
      - ../../../launcher-publish:/usr/share/nginx/gkz-launcher:ro

  openmu-startup:
    # Our own image, built from this repository's source (the published one lags behind).
    image: mu-server/openmu:local
    restart: unless-stopped
    # Only used when the database doesn't exist yet: initialize it with the MU GKZ Season 3 data.
    # To re-initialize an existing database, run once with -reinit added.
    command: ["-version:season3-gkz", "-resolveIP:loopback"]
    # The own network keys, client serial and anti-cheat secret (see .env, not committed). Only the key file
    # is mounted, not the folder with the signing key of the updates.
    environment:
      GKZ_NETWORK_KEYS_FILE: /app/secrets/gkz-network-keys.json
      GKZ_CLIENT_SERIAL: ${GKZ_CLIENT_SERIAL:-}
      GKZ_GUARD_SECRET: ${GKZ_GUARD_SECRET:-}
    volumes:
      - ${GKZ_NETWORK_KEYS_HOST_FILE}:/app/secrets/gkz-network-keys.json:ro

  database:
    restart: unless-stopped
