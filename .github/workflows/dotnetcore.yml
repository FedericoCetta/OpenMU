name: .NET Core

# MU GKZ: only by hand, so pushes don't use up the free Actions minutes; everything is built and tested locally.
on: [workflow_dispatch]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 10.0.x
    - name: Build with dotnet
      run: dotnet publish src/Startup/MUnique.OpenMU.Startup.csproj --configuration Release -p:ci=true
    - name: Test with dotnet
      run: dotnet test src/MUnique.OpenMU.sln --configuration Release -p:ci=true
